[project]
name = "reinfors-benchmarks"
version = "0.1.0"
description = "Systems benchmarks comparing reinfors against peer RL frameworks (OpenSpiel)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "open_spiel>=1.5",
    "chess>=1.10",  # SAN<->UCI conversion in the chess H2H bridge
    # reinfors is installed from a locally built wheel (see README) until it is published.
]

[tool.uv]
package = false
