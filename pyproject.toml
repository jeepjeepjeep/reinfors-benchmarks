[project]
name = "reinfors-benchmarks"
version = "0.1.0"
description = "Systems benchmarks comparing reinfors against peer RL frameworks (OpenSpiel)"
requires-python = ">=3.11"
# Dev/test env only (.venv): lint + harness test suites. Measurements run in .venv23,
# built from requirements-venv23.txt (torch 2.3.0 to match OpenSpiel's libtorch pin).
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "open_spiel>=1.5",
    "chess>=1.10",  # SAN<->UCI conversion in the chess H2H bridge
    "matplotlib>=3.8",  # scripts/plot_round.py telemetry panels
    # reinfors comes from a locally built wheel at the campaign's frozen tag (see README) —
    # never from PyPI, so measured code is pinned to a commit rather than a release.
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["experiments/tests"]
