name: ci

on:
  push:
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Ruff check
        run: uvx ruff@0.15.15 check experiments scripts

      - name: Ruff format check
        run: uvx ruff@0.15.15 format --check experiments scripts

      - name: Tests
        run: |
          uv sync
          uv run pytest experiments/tests
